<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540" role="img" aria-labelledby="title desc"><title id="title">ELE630 NCCT and CTP implemented model flowchart</title><desc id="desc">Independent pathways: NCCT image input through frozen ResNet-10 then train-only scaling and eight-dimensional PCA combined with eleven clinical features in L2 regression. Separately, 40 registered CTP frames through a frozen shared 3D encoder and temporal mean, scaling and PCA, eleven clinical features and a distinct L2 regression. Both predict a binary 90-day mRS score. No joint NCCT-CTP imaging model.</desc><rect width="1400" height="540" fill="#fff"/><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7.7" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><text x="40" y="55" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="700" fill="#0f172a">Implemented prediction architecture</text><text x="40" y="91" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="400" fill="#475569">Two independent clinical-imaging fusion models</text><rect x="40" y="124" width="192" height="27" rx="13" fill="#eff6ff"/><text x="54" y="142" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#2563eb">NCCT + clinical</text><rect x="40" y="159" width="216" height="106" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/><text x="55" y="196" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Admission NCCT</text><text x="55" y="221" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" fill="#475569">3D volume</text><path d="M261 212 L284 212" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="293" y="159" width="250" height="106" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/><text x="308" y="196" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Frozen ResNet-10</text><text x="308" y="221" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" fill="#475569">128-D embedding</text><path d="M548 212 L574 212" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="583" y="159" width="251" height="106" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/><text x="598" y="196" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Train-only scaler</text><text x="598" y="221" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" fill="#475569">PCA: 8 components</text><path d="M839 212 L865 212" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="874" y="159" width="230" height="106" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/><text x="889" y="196" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">+ 11 clinical features</text><text x="889" y="221" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" fill="#475569">L2 logistic fit</text><path d="M1109 212 L1133 212" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="1142" y="159" width="218" height="106" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/><text x="1157" y="196" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Fused output</text><text x="1157" y="221" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" fill="#475569">mRS 0–2 / 3–6</text><rect x="40" y="290" width="192" height="27" rx="13" fill="#f0fdfa"/><text x="54" y="308" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#0d9488">CTP + clinical</text><rect x="40" y="325" width="216" height="106" rx="14" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/><text x="55" y="362" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">CTP registered</text><text x="55" y="387" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" fill="#475569">40 frames</text><path d="M261 378 L284 378" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="293" y="325" width="250" height="106" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="1.8"/><text x="308" y="362" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Frozen shared 3D CNN</text><text x="308" y="387" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" fill="#475569">Temporal mean: 128-D</text><path d="M548 378 L574 378" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="583" y="325" width="251" height="106" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="1.8"/><text x="598" y="362" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Train-only scaler</text><text x="598" y="387" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" fill="#475569">PCA: 8 components</text><path d="M839 378 L865 378" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="874" y="325" width="230" height="106" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="1.8"/><text x="889" y="362" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">+ 11 clinical features</text><text x="889" y="387" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" fill="#475569">L2 logistic fit</text><path d="M1109 378 L1133 378" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arr)"/><rect x="1142" y="325" width="218" height="106" rx="14" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/><text x="1157" y="362" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Fused output</text><text x="1157" y="387" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" fill="#475569">mRS 0–2 / 3–6</text><rect x="40" y="455" width="1320" height="62" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><text x="60" y="480" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" fill="#334155">Each path has its own fitted L2 fusion model; a separate clinical-only baseline is evaluated.</text><text x="60" y="505" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#64748b">No joint NCCT–CTP imaging model. Grad-CAM and HiResCAM assess the fused scores.</text></svg>